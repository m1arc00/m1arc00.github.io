<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
    color: #222;
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
    user-select: none;
  }
  .stage {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    padding: 16px;
  }
  .stage img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .nav {
    position: absolute;
    top: 0; bottom: 0;
    width: 25%;
    border: 0;
    padding: 0;
    background: transparent;
    font-size: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .nav:focus { outline: none; }
  .nav.prev { left: 0; }
  .nav.next { right: 0; }
</style>
</head>
<body>
  <div class="stage">
    <button class="nav prev" aria-label="Previous"></button>
    <img id="photo" alt="">
    <button class="nav next" aria-label="Next"></button>
  </div>

<script>
const images = [
  "image1.png","image2.png","image3.png","image4.png",
  "image5.png","image6.png","image7.png","image8.png","image9.png"
];

const photo = document.getElementById('photo');
let i = 0;

function show(n) {
  i = (n + images.length) % images.length;
  photo.src = images[i];
  photo.alt = images[i];
}

const next = () => show(i + 1);
const prev = () => show(i - 1);

document.querySelector('.nav.next').onclick = next;
document.querySelector('.nav.prev').onclick = prev;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(images.length - 1);
});

show(0);
</script>
</body>
</html>
